name: forecast-daily

on:
#   schedule:
#     - cron: '20 0 * * *' # Berjalan setiap hari pukul 00:20 UTC
  workflow_dispatch: # Pemicu manual via tombol UI GitHub

jobs:
  run-forecast-daily:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd pipeline
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Execute Daily Live Forecast
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd pipeline/src
          python -m analyzer.jobs.forecast --symbol BTCUSDT --timeframe 1d --horizon 1 --conn "$DATABASE_URL"
          python -m analyzer.jobs.forecast --symbol BTCUSDT --timeframe 1d --horizon 7 --conn "$DATABASE_URL"
          python -m analyzer.jobs.forecast --symbol ETHUSDT --timeframe 1d --horizon 1 --conn "$DATABASE_URL"
          python -m analyzer.jobs.forecast --symbol ETHUSDT --timeframe 1d --horizon 7 --conn "$DATABASE_URL"
