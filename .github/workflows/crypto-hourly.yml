name: crypto-hourly

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

# Hanya satu run pada satu waktu. Run yang menunggu tidak dibatalkan.
concurrency:
  group: crypto-hourly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e pipeline
      # Run ini gagal (merah) hanya jika status job 'error' (kode keluar 1).
      - run: python -m analyzer.jobs.crypto_hourly
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
