name: forecast-hourly

on:
#   schedule:
#     - cron: '15 * * * *' # Berjalan setiap jam pada menit ke-15
  workflow_dispatch: # Memungkinkan eksekusi manual via tombol UI GitHub

jobs:
  run-forecast:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          cd pipeline
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Execute Live Forecast
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cd pipeline/src
          python -m analyzer.jobs.forecast --symbol BTCUSDT --timeframe 1h --horizon 4 --conn "$DATABASE_URL"
          python -m analyzer.jobs.forecast --symbol BTCUSDT --timeframe 1h --horizon 24 --conn "$DATABASE_URL"
          python -m analyzer.jobs.forecast --symbol ETHUSDT --timeframe 1h --horizon 4 --conn "$DATABASE_URL"
          python -m analyzer.jobs.forecast --symbol ETHUSDT --timeframe 1h --horizon 24 --conn "$DATABASE_URL"
