name: ci

on:
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "db/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "pipeline/**"
      - "db/**"
      - ".github/workflows/ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
